[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lassaseq"
version = "0.1.0"
description = "Tool for downloading and analyzing Lassa virus sequences"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Daan Jansen", email = "jansendaan94@gmail.com" }
]
dependencies = [
    "biopython>=1.80",
    "numpy>=1.20.0",
    "requests>=2.25.0",
    "tqdm>=4.50.0",
]

[project.urls]
Homepage = "https://github.com/DaanJansen94/LassaSeq"

[project.scripts]
lassaseq = "lassaseq.lassaseq:cli_main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
lassaseq = ["lineages/*"]
